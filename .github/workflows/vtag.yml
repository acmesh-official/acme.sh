name: Mirror version tag

# Historical release tags are plain version numbers ("3.1.3") and cannot be
# renamed. When a plain version tag is pushed (including the tag created by
# publishing a GitHub release), mirror it as a "v"-prefixed tag ("v3.1.3")
# pointing to the same object, so both forms exist.
# No retrigger loop: the tag filter never matches a "v"-prefixed tag, and
# refs created with GITHUB_TOKEN do not fire workflows anyway.
# The job mirrors first and then fails when the pushed tag is lightweight,
# which is what the release form produces: that tag can never carry a
# signature, so the failure has to be loud.

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  vtag:
    if: github.repository == 'acmesh-official/acme.sh'
    runs-on: ubuntu-latest
    steps:
      - name: Create the v-prefixed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Mirror the object the pushed tag actually points at: the commit
          # for a lightweight tag, the tag object itself for an annotated or
          # signed one. Pointing the mirror at the commit would strip the
          # signature, so "git verify-tag v3.1.3" would fail while
          # "git verify-tag 3.1.3" succeeds.
          _ref="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha + " " + .object.type')"
          sha="${_ref%% *}"
          objtype="${_ref##* }"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "Could not resolve refs/tags/$TAG"
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v$TAG" >/dev/null 2>&1; then
            echo "Tag v$TAG already exists, nothing to do."
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/v$TAG" -f sha="$sha"
            echo "Created tag v$TAG -> $sha"
          fi

      - name: Check that the tag is signable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release published from the GitHub UI creates the tag server-side
          # as a lightweight ref, which points straight at a commit and can
          # never carry a signature (3.1.5 shipped that way, see issue 7273).
          # The tag has to be created locally with "git tag -s" and pushed
          # BEFORE the release is published, then selected on the release form.
          objtype="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.type)"
          if [ "$objtype" != "tag" ]; then
            echo "::error::refs/tags/$TAG points at a $objtype, not a tag object. It is a lightweight tag and carries no signature. Recreate it locally with 'git tag -s $TAG' and push it before publishing the release."
            exit 1
          fi
          echo "refs/tags/$TAG is a tag object."
